<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect x="20" y="30" width="960" height="215" rx="8" fill="none" stroke="#b9b8b3" stroke-width="1.5"/><rect x="20" y="30" width="104" height="215" rx="8" fill="#f2f1ee" stroke="#8a8984" stroke-width="1.5"/><text x="72" y="137.5" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">Python</text><text x="72" y="161.5" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">(FastAPI)</text><rect x="20" y="275" width="960" height="215" rx="8" fill="none" stroke="#b9b8b3" stroke-width="1.5"/><rect x="20" y="275" width="104" height="215" rx="8" fill="#f2f1ee" stroke="#8a8984" stroke-width="1.5"/><text x="72" y="389.5" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">PostgreSQL</text><rect x="136" y="62" width="168" height="150" rx="8" fill="#f2f1ee" stroke="#8a8984" stroke-width="1.5"/><text x="220.0" y="110.73" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">1. Умови запиту</text><text x="220.0" y="134.48000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">user_id, тип,</text><text x="220.0" y="155.73000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">категорія, період,</text><text x="220.0" y="176.98000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">суми, валюта, чек</text><rect x="300" y="307" width="168" height="150" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="2.2"/><text x="384.0" y="355.73" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">2. GROUP BY</text><text x="384.0" y="379.48" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">name, note,</text><text x="384.0" y="400.73" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">category_name, tags</text><text x="384.0" y="421.98" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">+ array_agg(id_)</text><rect x="464" y="62" width="168" height="150" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="2.2"/><text x="548.0" y="110.73" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">3. Нечітке</text><text x="548.0" y="134.48000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">порівняння</text><text x="548.0" y="155.73000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">один раз на групу</text><text x="548.0" y="176.98000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">(match_score)</text><rect x="628" y="307" width="168" height="150" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="2.2"/><text x="712.0" y="355.73" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">4. Вибірка рядків</text><text x="712.0" y="379.48" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">WHERE id_ =</text><text x="712.0" y="400.73" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">ANY(:ids) —</text><text x="712.0" y="421.98" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">лише збіглі групи</text><rect x="792" y="62" width="168" height="150" rx="8" fill="#f2f1ee" stroke="#8a8984" stroke-width="1.5"/><text x="876.0" y="110.73" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#0b0b0b">5. Відповідь</text><text x="876.0" y="134.48000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">сортування</text><text x="876.0" y="155.73000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">за оцінкою, сторінка,</text><text x="876.0" y="176.98000000000002" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#52514e">підсумки</text><path d="M304,137 L384.0,137 L384.0,305" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/><path d="M468,382 L548.0,382 L548.0,214" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/><path d="M632,137 L712.0,137 L712.0,305" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/><path d="M796,382 L876.0,382 L876.0,214" fill="none" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/><rect x="260.56" y="460.9" width="246.88" height="23.400000000000002" fill="#ffffff"/><text x="384.0" y="478" font-family="'Times New Roman', Times, serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#2a78d6">2000 транзакцій → ≈ 240 груп</text><rect x="613.94" y="460.9" width="196.11999999999998" height="23.400000000000002" fill="#ffffff"/><text x="712.0" y="478" font-family="'Times New Roman', Times, serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#52514e">індекс (user_id, date)</text><rect x="20" y="524" width="34" height="22" rx="4" fill="#e3eefb" stroke="#2a78d6" stroke-width="2.2"/><text x="64" y="540" font-family="'Times New Roman', Times, serif" font-size="19" font-weight="normal" text-anchor="start" fill="#0b0b0b">етап 3 оптимізації (двокроковий запит)</text><text x="980" y="540" font-family="'Times New Roman', Times, serif" font-size="18" font-weight="normal" text-anchor="end" fill="#52514e" font-style="italic">запит без тексту: один SQL-запит</text></svg>