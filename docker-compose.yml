# Local stack: PostgreSQL + FastAPI backend + React frontend (nginx)
#
#   docker compose up --build      → http://localhost:5173
#
# Settings can be overridden in a .env file next to this file (see .env.example).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-financialdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-financialdb}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Uncomment to reach the DB from pgAdmin / psql on the host
    # ports:
    #   - "5433:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-financialdb}
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Behind the frontend's nginx: client IPs for the security history come from X-Forwarded-For
      TRUST_PROXY_HEADERS: "true"
      # Passkeys are bound to this domain (no port); set it to your real domain in production
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      NBU_API_URL: https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      UPLOAD_DIR: /app/uploads
      SEED_DATA: ${SEED_DATA:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"   # Swagger: http://localhost:8000/docs

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:${BACKEND_PORT:-8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db_data:
  uploads:
